[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rankwright"
version = "0.5.0"
description = "SEO, AEO and GEO toolkit: audit, JSON-LD, IndexNow, rank tracking, gated publishing"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mahirakash" }, { name = "S M Moshiur Rahman" }]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21", "ruff>=0.5", "rfc3339-validator>=0.1.4", "pyyaml>=6.0", "pillow>=10.0"]

gsc = ["google-auth>=2.30", "requests>=2.31"]

[project.scripts]
rankwright = "rankwright.cli:main"

[tool.setuptools.packages.find]
include = ["rankwright*"]

[tool.ruff]
line-length = 100
